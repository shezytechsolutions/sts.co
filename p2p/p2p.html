<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shezytech Solutions</title>
<style>
  :root{
    --bg-1:#0b1220;
    --bg-2:#0f1b2d;
    --panel:#101c2f;
    --accent:#28e0c4;
    --accent-dim:#1a8f7c;
    --text-hi:#f3f7f5;
    --text-lo:#9fb3c8;
    --border:rgba(255,255,255,0.08);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
  }

  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(40,224,196,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(40,224,196,0.06), transparent 40%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text-hi);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* faint grid texture, keeps the tech feel without being loud */
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
    pointer-events:none;
  }

  .overlay{
    position:relative;
    width:min(92vw, 460px);
    padding:44px 36px 32px;
    background:rgba(16,28,47,0.72);
    border:1px solid var(--border);
    border-radius:20px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.6);
    text-align:center;
    animation:rise 0.6s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .mark{
    width:52px;
    height:52px;
    margin:0 auto 20px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .mark span{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px solid var(--accent);
    opacity:0;
    animation:ping 2.4s ease-out infinite;
  }
  .mark span:nth-child(2){ animation-delay:0.8s; }
  .mark span:nth-child(3){ animation-delay:1.6s; }

  @keyframes ping{
    0%{ transform:scale(0.4); opacity:0.9; }
    100%{ transform:scale(1.4); opacity:0; }
  }

  .mark .dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 18px 2px rgba(40,224,196,0.7);
  }

  .company{
    font-size:13px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin-bottom:10px;
  }

  h1{
    font-size:clamp(20px, 4.5vw, 26px);
    line-height:1.35;
    font-weight:600;
    color:var(--text-hi);
    margin-bottom:10px;
  }

  p.sub{
    font-size:14.5px;
    color:var(--text-lo);
    line-height:1.55;
    margin-bottom:30px;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    width:100%;
    justify-content:center;
    padding:14px 22px;
    border-radius:12px;
    background:var(--accent);
    color:#062621;
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    letter-spacing:0.01em;
    transition:transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    box-shadow:0 12px 30px -10px rgba(40,224,196,0.55);
  }

  .cta:hover{
    background:#3bf0d2;
    transform:translateY(-2px);
    box-shadow:0 16px 36px -10px rgba(40,224,196,0.7);
  }

  .cta:active{
    transform:translateY(0);
  }

  .cta svg{
    width:16px;
    height:16px;
    transition:transform 0.18s ease;
  }

  .cta:hover svg{
    transform:translate(2px,-2px);
  }

  .foot{
    margin-top:18px;
    font-size:12px;
    color:var(--text-lo);
    opacity:0.7;
  }

  @media (max-width:420px){
    .overlay{
      padding:36px 24px 26px;
      border-radius:16px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .overlay{ animation:none; }
    .mark span{ animation:none; opacity:0.3; }
  }
</style>
</head>
<body>

  <div class="overlay">
    <div class="mark">
      <span></span>
      <span></span>
      <span></span>
      <div class="dot"></div>
    </div>

    <div class="company">Shezytech Solutions</div>
    <h1>Want to view this on our official site?</h1>
    <p class="sub">This preview is best experienced on our main website, where everything's kept fully up to date.</p>

    <a class="cta" href="https://www.shezytechsolutions.com" target="_blank" rel="noopener noreferrer">
      Visit official website
      <svg viewBox="0 0 24 24" fill="none" xmlns="https://p2p-wireline.up.railway.app">
        <path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div class="foot">&copy; <span id="year"></span> Shezytech Solutions. All rights reserved.</div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
