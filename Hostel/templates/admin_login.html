<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Portal • Login</title>
  <link rel="stylesheet" href="../static/css/admin_login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="container">
    <!-- Left branding panel -->
     <section class="brand" aria-label="University brand">
      <div class="brand-content">
        <!-- Logo Container -->
        <div class="logo-container">
          <img src="../static/img/logo.png" alt="BBS-Utech Logo" class="brand-logo">
        </div>
        
        <!-- Title -->
        <div class="brand-title">
          <h1>Admin Portal Login</h1>
          <p class="brand-subtitle"><b>Secure Admin Access</b></p>
        </div>
        
        <!-- More Info Link with Animation -->
        <div class="more-info-container">
          <a href="#" class="more-info-link" onclick="showMoreInfo()">
            <span class="more-info-text">More Info</span>
            <i class="fas fa-chevron-right more-info-icon"></i>
          </a>
        </div>
        

      </div>
    </section>

    <!-- Right login card -->
    <section class="card">
      <div class="card-header">
        <h2>Admin Login</h2>
        <p>Access the hostel management system</p>
      </div>

      <!-- Admin Login -->
      <form id="adminForm" method="POST" action="/admin_login" class="login-form">
        <div class="field">
          <label for="adminEmail">Admin Email</label>
          <input class="input" type="email" id="adminEmail" name="email" placeholder="admin@gmail.com" required>
        </div>

        <div class="field">
          <label for="adminPassword">Password</label>
          <div class="password-container">
            <input class="input" type="password" id="adminPassword" name="password" placeholder="••••••••" required>
            <span class="password-toggle" onclick="togglePassword('adminPassword')">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>

        <button class="btn" type="submit">Login</button>
        
        <div class="back-link" style="text-align: center; margin-top: 20px;">
          <p><a href="/" style="color: var(--brand); font-weight: 600;">← Back to Home</a></p>
        </div>
      </form>
    </section>
  </div>

  <script src="../static/js/admin_login.js"></script>
  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const icon = input.parentElement.querySelector('.password-toggle i');
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function showMoreInfo() {
      showNotification('DUE TO Github policies you cannot login to next pages by click on login you can see more information of this website );
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Form is now handled by login.js
    });
  </script>
</body>
</html>
